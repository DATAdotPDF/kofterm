<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">KofTerm</title>
  <desc id="d">Offline AI autocomplete terminal for Linux, written in KOF. A terminal window shows the command sudo apt upgrade with the rest of the line suggested in grey and a TAB hint.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)" opacity="0.55"/>

  <!-- title block -->
  <text x="72" y="150" font-family="JetBrains Mono, Consolas, monospace" font-size="72" font-weight="700" fill="#f9fafb">kof<tspan fill="url(#accent)">term</tspan></text>
  <rect x="74" y="172" width="120" height="6" rx="3" fill="url(#accent)"/>
  <text x="72" y="222" font-family="Inter, Segoe UI, sans-serif" font-size="24" fill="#d1d5db">Offline AI autocomplete terminal for Linux</text>
  <text x="72" y="256" font-family="Inter, Segoe UI, sans-serif" font-size="20" fill="#9ca3af">Written 100% in KOF · no network · TAB to accept</text>
  <text x="72" y="340" font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#6b7280">github.com/DATAdotPDF/kofterm</text>

  <!-- terminal window -->
  <g transform="translate(640 64)">
    <rect width="576" height="272" rx="14" fill="#0a0a0f" stroke="#374151" stroke-width="2"/>
    <rect width="576" height="40" rx="14" fill="#1f2937"/>
    <rect y="26" width="576" height="14" fill="#1f2937"/>
    <circle cx="24" cy="20" r="7" fill="#ef4444"/>
    <circle cx="48" cy="20" r="7" fill="#f59e0b"/>
    <circle cx="72" cy="20" r="7" fill="#22c55e"/>
    <text x="288" y="26" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#9ca3af">kofterm — bash</text>

    <g font-family="JetBrains Mono, Consolas, monospace" font-size="18">
      <text x="24" y="84" fill="#22c55e">$ <tspan fill="#e5e7eb">sudo apt update</tspan></text>
      <text x="24" y="114" fill="#6b7280">Hit:1 http://kali.download kali-rolling</text>
      <text x="24" y="144" fill="#6b7280">Reading package lists... Done</text>
      <text x="24" y="190" fill="#22c55e">$ <tspan fill="#e5e7eb">sudo apt up</tspan><tspan fill="#4b5563">grade -y</tspan></text>
      <rect x="166" y="174" width="2" height="22" fill="#f59e0b"/>
      <rect x="24" y="218" width="64" height="28" rx="6" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <text x="56" y="238" text-anchor="middle" font-size="15" fill="#f59e0b">TAB</text>
      <text x="100" y="238" font-size="15" fill="#9ca3af">accept · context: previous command</text>
    </g>
  </g>
</svg>
